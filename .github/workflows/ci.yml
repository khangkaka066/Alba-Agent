name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: phase9-ci-db-password
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:phase9-ci-db-password@localhost:5432/nexus
      NEXUS_TEST_DATABASE_URL: postgresql+asyncpg://nexus:phase9-ci-db-password@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Python runtime dependencies
        run: python -m pip install -r apps/api/requirements.txt pytest mypy==1.17.1
      - name: Install frozen frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize tenant runtime role and migrate test database
        env:
          POSTGRES_USER: nexus
          POSTGRES_DB: nexus
          PGPASSWORD: phase9-ci-db-password
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          NEXUS_RUNTIME_DB_PASSWORD: phase9-ci-runtime-password
        run: |
          sh apps/api/postgres-init/01-runtime-role.sh
          python -m alembic -c apps/api/alembic.ini upgrade head
      - name: Python tests and type checks
        run: |
          pytest -q
          mypy packages/ apps/api/
      - name: Frontend checks
        run: pnpm lint && pnpm check && pnpm test
      - name: Dependency license checks
        run: |
          node scripts/check-npm-licenses.mjs
          python scripts/check-python-licenses.py
      - name: Branding hygiene
        run: '! grep -riE "langgenius|dify|rakazo|inbox zero" apps/ packages/ --exclude="THIRD_PARTY_NOTICES.md"'

  images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image for multiple architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image for multiple architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: NEXT_PUBLIC_NEXUS_API_WS_URL=wss://localhost
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build sandbox image for multiple architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/computer-sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/sandbox:latest
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
