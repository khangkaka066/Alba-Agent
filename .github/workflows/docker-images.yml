name: Docker images

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "infra/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-images.yml"
  push:
    tags: ["docker-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/docker-v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v7
      - name: Registry names must be lower-case
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image for multiple architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image for multiple architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: NEXT_PUBLIC_NEXUS_API_WS_URL=wss://localhost
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build sandbox image for multiple architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/computer-sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}/sandbox:latest
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
