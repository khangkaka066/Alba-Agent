<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox browser verification</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #101113; color: #f4f4f5; font: 16px system-ui, sans-serif; }
  header { position: absolute; top: 40px; left: 64px; right: 64px; display: flex; align-items: center; gap: 10px; padding-bottom: 26px; border-bottom: 1px solid #303034; color: #a1a1aa; font-size: 13px; }
  header b { color: #f4f4f5; font-weight: 500; } header span { margin-left: auto; } header i { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: #4ade80; }
  h1 { position: absolute; top: 104px; left: 64px; margin: 0; font-size: 36px; font-weight: 500; letter-spacing: -1px; }
  .description { position: absolute; top: 162px; left: 64px; color: #a1a1aa; font-size: 15px; }
  #name { position: absolute; left: 64px; top: 240px; width: 420px; height: 44px; padding: 10px 14px; border: 1px solid #3f3f46; border-radius: 6px; color: #f4f4f5; background: #18181b; font: inherit; }
  #name:focus { outline: 2px solid #06b6d4; outline-offset: 2px; }
  button { position: absolute; left: 500px; top: 240px; width: 100px; height: 44px; border: 0; border-radius: 6px; background: #06b6d4; color: #07191c; font: 500 14px system-ui; cursor: pointer; }
  #result { position: absolute; top: 312px; left: 64px; right: 64px; min-height: 110px; margin: 0; padding: 24px; border: 1px solid #303034; border-radius: 8px; color: #a1a1aa; background: #151518; }
  footer { position: absolute; bottom: 42px; left: 64px; color: #71717a; font-size: 12px; }
</style>
<header><b>Alba Agent</b> / Computer workspace <span><i></i>Local preview</span></header>
<h1>Preview is running.</h1><p class="description">A local verification page for real browser input and screen capture.</p>
<input id="name" aria-label="Verification message" placeholder="Type in the virtual computer">
<button onclick="document.querySelector('#result').textContent=document.querySelector('#name').value">Go</button>
<p id="result">Ready</p><footer>Served from this task’s isolated workspace · browser verification fixture</footer>
</html>
