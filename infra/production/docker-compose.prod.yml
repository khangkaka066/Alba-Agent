name: nexus-agent-studio-prod

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${NEXUS_POSTGRES_USER:-nexus}
      POSTGRES_DB: ${NEXUS_POSTGRES_DB:-nexus}
      POSTGRES_PASSWORD: ${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD}
      NEXUS_RUNTIME_DB_PASSWORD: ${NEXUS_RUNTIME_DB_PASSWORD:?Set NEXUS_RUNTIME_DB_PASSWORD}
    volumes:
      - nexus_prod_postgres:/var/lib/postgresql/data
      - ../../apps/api/postgres-init/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    environment:
      NEXUS_REDIS_PASSWORD: ${NEXUS_REDIS_PASSWORD:?Set NEXUS_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${NEXUS_REDIS_PASSWORD}\""]
    volumes: [nexus_prod_redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${NEXUS_REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [data]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [nexus_prod_qdrant:/qdrant/storage]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [data]
    restart: unless-stopped

  sandbox-supervisor:
    build:
      context: ../..
      dockerfile: packages/computer-sandbox/Dockerfile
    image: ${NEXUS_SANDBOX_IMAGE:-nexus-sandbox-python:3.11}
    environment:
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [app]
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../.env
    environment: &api_environment
      NEXUS_BRAND_NAME: ${NEXUS_BRAND_NAME:-NexusAgent Studio}
      NEXUS_CORS_ORIGINS: https://${NEXUS_DOMAIN:?Set NEXUS_DOMAIN}
      NEXUS_DB_HOST: postgres
      NEXUS_DB_NAME: ${NEXUS_POSTGRES_DB:-nexus}
      NEXUS_DB_USER: nexus_runtime
      NEXUS_DB_PASSWORD: ${NEXUS_RUNTIME_DB_PASSWORD:?Set NEXUS_RUNTIME_DB_PASSWORD}
      NEXUS_MIGRATION_DATABASE_URL: postgresql+asyncpg://${NEXUS_POSTGRES_USER:-nexus}:${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD}@postgres:5432/${NEXUS_POSTGRES_DB:-nexus}
      NEXUS_SETUP_DATABASE_URL: postgresql+asyncpg://${NEXUS_POSTGRES_USER:-nexus}:${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD}@postgres:5432/${NEXUS_POSTGRES_DB:-nexus}
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PASSWORD: ${NEXUS_REDIS_PASSWORD:?Set NEXUS_REDIS_PASSWORD}
      NEXUS_QDRANT_URL: http://qdrant:6333
      NEXUS_SANDBOX_URL: http://api:8000/api/v1/sandboxes
      NEXUS_COMPUTER_ROOT: /var/lib/nexus/computers
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
      LITELLM_TELEMETRY_DISABLED: "true"
      LITELLM_OFFLINE_MODE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nexus_prod_computers:/var/lib/nexus/computers
    group_add: ["${NEXUS_DOCKER_GID:-0}"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      sandbox-supervisor: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [app, data]
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["worker"]
    env_file: ../../.env
    environment: *api_environment
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nexus_prod_computers:/var/lib/nexus/computers
    group_add: ["${NEXUS_DOCKER_GID:-0}"]
    depends_on:
      api: {condition: service_healthy}
    networks: [app, data]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_NEXUS_API_WS_URL: wss://${NEXUS_DOMAIN:?Set NEXUS_DOMAIN}
    environment:
      NEXUS_BRAND_NAME: ${NEXUS_BRAND_NAME:-NexusAgent Studio}
      NEXUS_API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      OTEL_SDK_DISABLED: "true"
      CREWAI_DISABLE_TELEMETRY: "true"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [app]
    restart: unless-stopped

  caddy:
    image: caddy:2.9.1-alpine
    environment:
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:?Set NEXUS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nexus_prod_caddy_data:/data
      - nexus_prod_caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [app]
    restart: unless-stopped

  database-backup:
    image: postgres:16.4-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${NEXUS_POSTGRES_USER:-nexus}
      PGDATABASE: ${NEXUS_POSTGRES_DB:-nexus}
      PGPASSWORD: ${NEXUS_POSTGRES_PASSWORD:?Set NEXUS_POSTGRES_PASSWORD}
      NEXUS_BACKUP_RETENTION_DAYS: ${NEXUS_BACKUP_RETENTION_DAYS:-14}
      NEXUS_BACKUP_INTERVAL_SECONDS: ${NEXUS_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - nexus_prod_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-postgres.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    restart: unless-stopped

networks:
  app:
  data:
    internal: true

volumes:
  nexus_prod_postgres:
  nexus_prod_redis:
  nexus_prod_qdrant:
  nexus_prod_computers:
  nexus_prod_caddy_data:
  nexus_prod_caddy_config:
  nexus_prod_backups:
